<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>User Profile</title>
    <link rel="stylesheet" href="\Css\profile.css"/>
</head>
<body>

    <div class="profile-container">

        <!-- Profile Header -->
        <div class="profile-header">
            <div class="avatar" id="uavatar">U</div>
            <h2 class="username" id="uname">Udupa</h2>
            <p class="email" id="mail">udupa@example.com</p>

            <!-- NEW: Stats Section -->
            <div class="profile-stats">
                <div class="stat">
                    <span class="stat-number" id="numposts">12</span>
                    <span class="stat-label">Posts</span>
                </div>
                <div class="stat">
                    <span class="stat-number">38</span>
                    <span class="stat-label">Comments</span>
                </div>
            </div>
        </div>

        <!-- User Details -->
        <div class="profile-details">
            <div class="detail-row">
                <span class="label">Full Name</span>
                <span class="value" id="fname">Udupa L</span>
            </div>

            <div class="detail-row">
                <span class="label">Phone</span>
                <span class="value" id="phno">+91 9XXXXXXXXX</span>
            </div>

            <div class="detail-row">
                <span class="label">Location</span>
                <span class="value" >Bengaluru, India</span>
            </div>

            <div class="detail-row">
                <span class="label">Joined On</span>
                <span class="value">Feb 2025</span>
            </div>
        </div>

    </div>
<script src="\Js\profile.js"></script>
</body>
</html>
