<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocalLens - Community Issue Tracker</title>
    <link rel="stylesheet" href="\Css\tets.css">
</head>

<body>

    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="logo-section">
                <div class="logo">L</div>
                <h1 class="logo-text">LocalLens</h1>
            </div>

            <button class="report-btn" onclick="window.location.href='/Html/post.html'">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                    <circle cx="12" cy="13" r="4"></circle>
                </svg>
                <span>Report Issue</span>
            </button>
        </div>
    </header>

    <!-- Category Filter -->
    <div class="category-filter">
        <div class="category-content">
            <button class="category-btn active">🌐 All Issues</button>
            <button class="category-btn">🕳 Potholes</button>
            <button class="category-btn">🗑 Garbage</button>
            <button class="category-btn">💧 Water Leak</button>
            <button class="category-btn">🐕 Stray Animals</button>
            <button class="category-btn">⚠ Other</button>
        </div>
    </div>

    <!-- FEED POST -->
    <div id="di">

        

    </div>
<script src="\Js\test.js"></script>
</body>
</html>
